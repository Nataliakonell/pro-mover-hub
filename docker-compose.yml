version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: pro_mover_postgres
    environment:
      POSTGRES_DB: pro_mover_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
